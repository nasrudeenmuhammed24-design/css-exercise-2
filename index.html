<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class and ID Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p class="odin">Number 1 - I'm a class!</p>
    <div id="one">Number 2 - I'm a ID.</div>
    <p class="odin you">Number 3 - I'm a class, but cooler!</p>
    <div id="two">Number 4 - I'm another ID.</div>
    <p class="odin">Number 5 - I'm a class!</p>
</body>
</html>
